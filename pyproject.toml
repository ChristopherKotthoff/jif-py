[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jif"
version = "0.1.0"
description = "The if statement, finally powered by AI."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[tool.hatch.build.targets.wheel]
packages = ["jif"]

[tool.hatch.build.targets.wheel.force-include]
"jif.pth" = "jif.pth"
